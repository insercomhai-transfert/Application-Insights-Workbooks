  <script>↩
    document.addEventListener('DOMContentLoaded', function () {↩
      /**↩
       * WeakMap to store the initial order of items for each grid.↩
       * Key: grid HTMLElement↩
       * Value: Array of marketing-services_item HTMLElements in their initial order↩
       */↩
      const initialGridOrderMap = new WeakMap();↩
↩
      /**↩
       * Function to sort items within a specific grid.↩
       * @param {string} order - Sort order: 'atoz' for ascending, 'ztoa' for descending, 'popular' for default order.↩
       * @param {HTMLElement} grid - The grid element containing items to sort.↩
       */↩
      function sortItems(order, grid) {↩
        if (!grid) {↩
          console.warn('No grid element provided for sorting.');↩
          return;↩
        }↩
↩
        if (order === 'popular') {↩
          // Restore the initial order↩
          const initialOrder = initialGridOrderMap.get(grid);↩
          if (initialOrder && Array.isArray(initialOrder)) {↩
            // Clear the grid↩
            while (grid.firstChild) {↩
              grid.removeChild(grid.firstChild);↩
            }↩
↩
            // Append items in the initial order↩
            initialOrder.forEach(item => {↩
              grid.appendChild(item);↩
              item.classList.add('visible'); // Ensure transitions apply↩
            });↩
          } else {↩
            console.warn('Initial order not found for the grid.');↩
          }↩
          return;↩
        }↩
↩
        // Retrieve all items within the grid as an array↩
        const itemsArray = Array.from(grid.querySelectorAll('.marketing-services_item'));↩
↩
        // Sort the items based on the text content of their headings↩
        itemsArray.sort((a, b) => {↩
          const headingA = a.querySelector('.marketing-services_heading')?.textContent.trim().toUpperCase() || '';↩
          const headingB = b.querySelector('.marketing-services_heading')?.textContent.trim().toUpperCase() || '';↩
↩
          if (order === 'atoz') {↩
            return headingA.localeCompare(headingB, 'en', { sensitivity: 'base' });↩
          } else if (order === 'ztoa') {↩
            return headingB.localeCompare(headingA, 'en', { sensitivity: 'base' });↩
          } else {↩
            return 0; // No sorting if order is unrecognized↩
          }↩
        });↩
↩
        // Remove all existing items from the grid↩
        while (grid.firstChild) {↩
          grid.removeChild(grid.firstChild);↩
        }↩
↩
        // Create a DocumentFragment to optimize DOM manipulation↩
        const fragment = document.createDocumentFragment();↩
↩
        // Append sorted items to the fragment and add 'visible' class for transitions↩
        itemsArray.forEach(item => {↩
          fragment.appendChild(item);↩
          item.classList.add('visible');↩
        });↩
↩
        // Append the fragment back to the grid↩
        grid.appendChild(fragment);↩
      }↩
↩
      /**↩
       * Function to manage the active state of sort triggers within a container.↩
       * @param {HTMLElement} activeTrigger - The sort trigger that was clicked.↩
       * @param {NodeList} triggers - All sort triggers within the same container.↩
       */↩
      function setActiveSortTrigger(activeTrigger, triggers) {↩
        triggers.forEach(trigger => {↩
          if (trigger === activeTrigger) {↩
            trigger.classList.add('active');↩
            trigger.setAttribute('aria-pressed', 'true');↩
          } else {↩
            trigger.classList.remove('active');↩
            trigger.setAttribute('aria-pressed', 'false');↩
          }↩
        });↩
      }↩
↩
      /**↩
       * Function to handle click events on sort triggers.↩
       * @param {Event} event - The click event.↩
       */↩
      function handleSortTriggerClick(event) {↩
        event.preventDefault(); // Prevent default link behavior↩
↩
        const trigger = event.currentTarget;↩
        const sortOrder = trigger.getAttribute('hf-filter-trigger')?.toLowerCase();↩
↩
        // Validate sort order↩
        if (!['atoz', 'ztoa', 'popular'].includes(sortOrder)) {↩
          console.warn(`Unknown sort order: "${sortOrder}". Supported orders are "atoz", "ztoa", and "popular".`);↩
          return;↩
        }↩
↩
        // Find the closest parent tab pane↩
        const tabPane = trigger.closest('.w-tab-pane');↩
↩
        if (!tabPane) {↩
          console.warn('Sort trigger is not within a tab pane.');↩
          return;↩
        }↩
↩
        // Find the grid within the same tab pane↩
        const grid = tabPane.querySelector('.marketing-services_grid');↩
↩
        if (!grid) {↩
          console.warn('No grid found within this tab pane.');↩
          return;↩
        }↩
↩
        // Perform sorting based on the sortOrder↩
        sortItems(sortOrder, grid);↩
↩
        // Get all sort triggers within the same sort triggers container↩
        const sortTriggersContainer = trigger.parentElement; // Assuming sort-triggers is the parent↩
        const sortTriggers = sortTriggersContainer.querySelectorAll('a[hf-filter-trigger]');↩
↩
        // Update active state↩
        setActiveSortTrigger(trigger, sortTriggers);↩
↩
        // Copy the text of the clicked sort trigger to elements with ht-toggle-text within the same tab pane↩
        const toggleTextElements = tabPane.querySelectorAll('[ht-toggle-text]');↩
        const triggerText = trigger.textContent.trim();↩
        toggleTextElements.forEach(elem => {↩
          elem.textContent = triggerText;↩
        });↩
      }↩
↩
      /**↩
       * Function to initialize sorting functionality for all grids within tab panes.↩
       */↩
      function initializeSorting() {↩
        // Select all tab panes↩
        const tabPanes = document.querySelectorAll('.w-tab-pane');↩
↩
        tabPanes.forEach(tabPane => {↩
          // Select all sort triggers within the current tab pane↩
          const sortTriggers = tabPane.querySelectorAll('a[hf-filter-trigger]');↩
↩
          // Select the grid within the current tab pane↩
          const grid = tabPane.querySelector('.marketing-services_grid');↩
↩
          if (!grid) {↩
            console.warn('No grid found within this tab pane.');↩
            return;↩
          }↩
↩
          // Store the initial order of items in the grid↩
          const initialItems = Array.from(grid.querySelectorAll('.marketing-services_item'));↩
          initialGridOrderMap.set(grid, initialItems);↩
↩
          // Attach click event listeners to each sort trigger↩
          sortTriggers.forEach(trigger => {↩
            trigger.addEventListener('click', handleSortTriggerClick);↩
          });↩
↩
          // Initialize the visibility of items for smooth transitions↩
          const items = grid.querySelectorAll('.marketing-services_item');↩
          items.forEach(item => {↩
            // Trigger reflow to ensure CSS transitions apply↩
            void item.offsetWidth;↩
            item.classList.add('visible');↩
          });↩
        });↩
      }↩
↩
      /**↩
       * Function to handle tab navigation (switching between tabs).↩
       */↩
      function initializeTabNavigation() {↩
        const tabButtons = document.querySelectorAll('.tab-navigation button');↩
        const tabPanes = document.querySelectorAll('.w-tab-pane');↩
↩
        tabButtons.forEach(button => {↩
          button.addEventListener('click', function () {↩
            const targetTab = this.getAttribute('data-tab');↩
↩
            // Remove 'active' class from all tab buttons and panes↩
            tabButtons.forEach(btn => btn.classList.remove('active'));↩
            tabPanes.forEach(pane => pane.classList.remove('active'));↩
↩
            // Add 'active' class to the clicked tab button and corresponding tab pane↩
            this.classList.add('active');↩
            const targetPane = document.querySelector(`.w-tab-pane[ht-tab-pane="${targetTab}"]`);↩
            if (targetPane) {↩
              targetPane.classList.add('active');↩
            } else {↩
              console.warn(`No tab pane found with ht-tab-pane="${targetTab}".`);↩
            }↩
          });↩
        });↩
↩
        // Optionally, activate the first tab by default if not already active↩
        const activeTabButton = document.querySelector('.tab-navigation button.active');↩
        if (!activeTabButton && tabButtons.length > 0) {↩
          tabButtons[0].click();↩
        }↩
      }↩
↩
      // Initialize tab navigation functionality↩
      initializeTabNavigation();↩
↩
      // Initialize sorting functionality for all grids within tab panes↩
      initializeSorting();↩
    });↩
